name: Decompile LuaJIT

on:
  workflow_dispatch:

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get decompiler
        run: git clone https://github.com/Dr-MTN/luajit-decompiler.git ljd-tool

      - name: Decompile
        run: |
          mkdir -p output
          python3 ljd-tool/main.py --recursive ./input --dir_out ./output --catch_asserts --file-extension .luac --enable_logging || true
          python3 ljd-tool/main.py --recursive ./input --dir_out ./output --catch_asserts --file-extension .lua || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decompiled
          path: |
            output
            logs
