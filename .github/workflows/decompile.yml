name: Decompile luac to Lua

on:
  workflow_dispatch:
  push:
    paths:
      - "luac/**"

permissions:
  contents: write

jobs:
  decompile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download decompiler (latest release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir tool
          gh release download --repo marsinator358/luajit-decompiler-v2 --pattern "*.exe" --dir tool
          ls tool

      - name: Show decompiler options
        shell: pwsh
        run: |
          $exe = (Get-ChildItem tool -Filter *.exe | Select-Object -First 1).FullName
          & $exe -? 2>&1 | Out-String | Write-Host
        continue-on-error: true

      - name: Decompile
        shell: pwsh
        run: |
          $exe = (Get-ChildItem tool -Filter *.exe | Select-Object -First 1)
          & $exe.FullName "$env:GITHUB_WORKSPACE\luac"
          # default output folder is next to the exe
          New-Item -ItemType Directory -Force -Path lua_out | Out-Null
          Copy-Item "$($exe.DirectoryName)\output\*" lua_out -Recurse -Force
        continue-on-error: true

      - name: Upload decompiled Lua
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-lua
          path: lua_out/
          if-no-files-found: warn

      - name: Commit decompiled files back to repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lua_out
          git diff --cached --quiet || (git commit -m "Decompiled Lua [skip ci]" && git push)
